<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../static/css/style.css" />
    <link rel="stylesheet" href="../static/css/normalize.css" />
    <link rel="stylesheet" href="../static/css/login.css" />
    <link rel="icon" href="../static/img/icon.png" type="image/x-icon" />
    <script src="https://kit.fontawesome.com/e3d1ead7f0.js" crossorigin="anonymous"></script>
    <title>Reset Password</title>
</head>
<body>
    <div class="container">
        <div class="main__reset-password">
            <div class="main__darken-gradient"></div>
            <div class="main__reset-password--title">
                <h4>Password Reset</h4>
                <p>새로운 비밀번호를 입력하세요.</p>
            </div>
            <div class="main__reset-password--session">
                <form id="reset-password-form" action="/password/{{ token }}/reset" method="POST">
                    <label for="password">
                        <i class="fa-solid fa-unlock-keyhole"> <span>New Password</span> </i>
                    </label>
                    <input type="password" id="password" name="password" required minlength="6" placeholder="새 비밀번호" />
                    <label for="password_confirm">
                        <i class="fa-solid fa-unlock-keyhole"> <span>Confirm</span> </i>
                    </label>
                    <input type="password" id="password_confirm" name="password_confirm" required minlength="6" placeholder="비밀번호 확인" />
                    <button type="submit" class="main__reset-password--btn"><i class="fa-solid fa-key"></i>Change Password</button>
                    <p class="check-valid">비밀번호는 최소 6자 이상이어야 합니다.</p>
                </form>
            </div>
        </div>

        <footer class="main__footer">
            <div class="main__footer--element">
                <i class="fa-brands fa-github fa-xl"></i>
                <i class="fa-solid fa-envelope fa-xl"></i>
                <i class="fa-brands fa-google-plus-square fa-xl"></i>
            </div>
            <div class="main__footer--element">
                <p>Copyright © 2022 dev_rookiand.co.,Ltd. All rights reserved.</p>
            </div>
        </footer>

        <script type="module" src="../static/js/login.js"></script>
    </div>
</body>
